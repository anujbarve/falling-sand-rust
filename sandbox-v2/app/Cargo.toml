[package]
name = "sandbox_v2_app"
version = "0.1.0"
edition = "2021"

[lib]
name = "sandbox_v2_app"
path = "src/lib.rs"

[[bin]]
name = "sandbox_v2_app"
path = "src/main.rs"

[dependencies]
sandbox_v2_gpu = { path = "../gpu" }
# v1 crates, used for compatibility: the save text format and config loader
# (sandbox_core) and the audio thread (sandbox_audio::AudioHandle).
sandbox_core = { path = "../../sandbox/core" }
sandbox_audio = { path = "../../sandbox/audio" }
wgpu = "=30.0.1"
winit = "=0.30.13"
bytemuck = { version = "=1.25.2", features = ["derive"] }
