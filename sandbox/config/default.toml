# Sandbox configuration. Read from a path the app passes to `load_config`.
# Any key may be omitted; omitted keys keep the defaults shown here.
# A missing or malformed file falls back to all defaults with one warning.

# Seed for the simulation RNG (unsigned 32-bit).
seed = 1

# Wind speed driving ocean waves; 0 is calm, 5 or more is the strongest swell.
wind = 2.0

# Row (cells from the top) of the resting ocean surface.
sea_level = 40

# Brush radius in cells.
brush = 3

# Master sound volume, 0.0 (mute) to 1.0 (full).
volume = 0.5
