[package]
name = "sand"
version = "0.1.0"
edition = "2024"
default-run = "sand"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
macroquad = "0.4.16"
pollster = "1.0.1"
rayon = "1.12.0"
wgpu = "30.0.1"

# Optimise dependencies and our own code a bit even in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
