<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="active-region-title active-region-desc">
  <title id="active-region-title">Storage chunks do not define the simulation boundary</title>
  <desc id="active-region-desc">The active rectangle is the visible view plus a 16-cell margin on each side. Overlapping chunks can extend farther; update only their intersection with the active rectangle.</desc>
  <rect x="0" y="0" width="960" height="400" fill="#f5f3eb" stroke="none" stroke-width="1" rx="0" />
  <text x="32" y="38" fill="#243b35" font-family="Arial, sans-serif" font-size="25" text-anchor="start">Storage chunks do not define the simulation boundary</text>
  <rect x="55" y="85" width="100" height="82" fill="#ffffff" stroke="#aabbb0" stroke-width="1" rx="0" />
  <rect x="155" y="85" width="100" height="82" fill="#ffffff" stroke="#aabbb0" stroke-width="1" rx="0" />
  <rect x="255" y="85" width="100" height="82" fill="#ffffff" stroke="#aabbb0" stroke-width="1" rx="0" />
  <rect x="355" y="85" width="100" height="82" fill="#ffffff" stroke="#aabbb0" stroke-width="1" rx="0" />
  <rect x="455" y="85" width="100" height="82" fill="#ffffff" stroke="#aabbb0" stroke-width="1" rx="0" />
  <rect x="55" y="167" width="100" height="82" fill="#ffffff" stroke="#aabbb0" stroke-width="1" rx="0" />
  <rect x="155" y="167" width="100" height="82" fill="#ffffff" stroke="#aabbb0" stroke-width="1" rx="0" />
  <rect x="255" y="167" width="100" height="82" fill="#ffffff" stroke="#aabbb0" stroke-width="1" rx="0" />
  <rect x="355" y="167" width="100" height="82" fill="#ffffff" stroke="#aabbb0" stroke-width="1" rx="0" />
  <rect x="455" y="167" width="100" height="82" fill="#ffffff" stroke="#aabbb0" stroke-width="1" rx="0" />
  <rect x="55" y="249" width="100" height="82" fill="#ffffff" stroke="#aabbb0" stroke-width="1" rx="0" />
  <rect x="155" y="249" width="100" height="82" fill="#ffffff" stroke="#aabbb0" stroke-width="1" rx="0" />
  <rect x="255" y="249" width="100" height="82" fill="#ffffff" stroke="#aabbb0" stroke-width="1" rx="0" />
  <rect x="355" y="249" width="100" height="82" fill="#ffffff" stroke="#aabbb0" stroke-width="1" rx="0" />
  <rect x="455" y="249" width="100" height="82" fill="#ffffff" stroke="#aabbb0" stroke-width="1" rx="0" />
  <rect x="107" y="115" width="360" height="188" fill="#e1eae1" stroke="#28755b" stroke-width="2" rx="0" />
  <rect x="139" y="147" width="296" height="124" fill="#ffffff" stroke="#28755b" stroke-width="2" rx="0" />
  <text x="287" y="211" fill="#28755b" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">VISIBLE VIEW</text>
  <text x="510" y="301" fill="#61736c" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">chunk grid</text>
  <line x1="139" y1="147" x2="139" y2="115" stroke="#28755b" stroke-width="2" />
  <text x="156" y="139" fill="#28755b" font-family="Arial, sans-serif" font-size="15" text-anchor="start">16 cells</text>
  <text x="602" y="148" fill="#243b35" font-family="Arial, sans-serif" font-size="19" text-anchor="start">Visible cells: draw + update</text>
  <text x="602" y="203" fill="#243b35" font-family="Arial, sans-serif" font-size="19" text-anchor="start">Margin cells: update only</text>
  <text x="602" y="258" fill="#243b35" font-family="Arial, sans-serif" font-size="19" text-anchor="start">Outside: frozen</text>
  <text x="32" y="370" fill="#61736c" font-family="Arial, sans-serif" font-size="17" text-anchor="start">Schematic: the 16-cell margin is clipped inside each overlapping storage chunk.</text>
</svg>