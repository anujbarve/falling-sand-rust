<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="undo-state-match-title undo-state-match-desc">
  <title id="undo-state-match-title">Undo restores only cells still matching the painted state</title>
  <desc id="undo-state-match-desc">The action records before and after. If the live cell still matches the painted after state, restore before. If wetness changed, full-state matching skips it instead of erasing that later change.</desc>
  <rect x="0" y="0" width="960" height="400" fill="#f5f3eb" stroke="none" stroke-width="1" rx="0" />
  <text x="32" y="38" fill="#243b35" font-family="Arial, sans-serif" font-size="25" text-anchor="start">Undo restores only cells still matching the painted state</text>
  <text x="127" y="100" fill="#28755b" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">BEFORE</text>
  <text x="362" y="100" fill="#28755b" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">PAINTED AFTER</text>
  <text x="597" y="100" fill="#28755b" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">LIVE NOW</text>
  <text x="832" y="100" fill="#28755b" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">UNDO RESULT</text>
  <rect x="35" y="125" width="185" height="65" fill="#e1eae1" stroke="#aabbb0" stroke-width="1" rx="5" />
  <text x="127.5" y="164.5" fill="#243b35" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">air, dry</text>
