<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="shoreline-mass-title shoreline-mass-desc">
  <title id="shoreline-mass-title">A drawn ripple cannot move shoreline material</title>
  <desc id="shoreline-mass-desc">Rendered waves change colour only. Mechanical erosion needs a separate simulation rule that moves sand and respects the approved water-volume policy.</desc>
  <rect x="0" y="0" width="960" height="400" fill="#f5f3eb" stroke="none" stroke-width="1" rx="0" />
  <text x="32" y="38" fill="#243b35" font-family="Arial, sans-serif" font-size="25" text-anchor="start">A drawn ripple cannot move shoreline material</text>
  <rect x="35" y="112" width="250" height="95" fill="#e1eae1" stroke="#aabbb0" stroke-width="1" rx="5" />
  <text x="160.0" y="156.5" fill="#243b35" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">visual ripple</text>
  <text x="160.0" y="185.5" fill="#61736c" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">changes pixels only</text>
  <rect x="35" y="245" width="250" height="70" fill="#e1eae1" stroke="#aabbb0" stroke-width="1" rx="5" />
  <text x="160.0" y="287.0" fill="#243b35" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">no cell transfer</text>
  <line x1="160" y1="207" x2="160" y2="245" stroke="#28755b" stroke-width="3" />
  <polygon points="160,245 155.21537912477646,235.09508187412055 164.78462087522354,235.09508187412055" fill="#28755b" />
  <rect x="410" y="112" width="250" height="95" fill="#e1eae1" stroke="#aabbb0" stroke-width="1" rx="5" />
  <text x="535.0" y="156.5" fill="#243b35" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">erosion rule</text>
  <text x="535.0" y="185.5" fill="#61736c" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">changes world state</text>
  <line x1="660" y1="160" x2="735" y2="160" stroke="#28755b" stroke-width="3" />
  <polygon points="735,160 725.0950818741205,164.78462087522354 725.0950818741205,155.21537912477646" fill="#28755b" />
  <rect x="735" y="112" width="190" height="95" fill="#e1eae1" stroke="#aabbb0" stroke-width="1" rx="5" />
  <text x="830.0" y="156.5" fill="#243b35" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">sand moves</text>
  <text x="830.0" y="185.5" fill="#61736c" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">test counts</text>
  <text x="650" y="292" fill="#28755b" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">Simulation effect ≠ decoration</text>
  <text x="32" y="370" fill="#61736c" font-family="Arial, sans-serif" font-size="17" text-anchor="start">V1 has rendered ripples. V2 shore erosion needs its own bounded rule and acceptance test.</text>
</svg>