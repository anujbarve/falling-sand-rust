  <text x="32" y="38" fill="#243b35" font-family="Arial, sans-serif" font-size="25" text-anchor="start">A group needs support outside itself</text>
  <text x="240" y="100" fill="#28755b" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">SUPPORTED</text>
  <text x="710" y="100" fill="#61736c" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">FLOATING</text>
  <rect x="100" y="145" width="50" height="45" fill="#e1eae1" stroke="#aabbb0" stroke-width="1" rx="0" />
