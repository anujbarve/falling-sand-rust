<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="support-anchor-title support-anchor-desc">
  <title id="support-anchor-title">A group needs support outside itself</title>
  <desc id="support-anchor-desc">Adjacent rigid cells form one connected group. Their internal contacts are not external support. A grounded column can anchor the group, while an identical floating row falls.</desc>
