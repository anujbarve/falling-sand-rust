  <text x="695" y="321" fill="#61736c" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">No outside anchor</text>
  <text x="32" y="370" fill="#61736c" font-family="Arial, sans-serif" font-size="17" text-anchor="start">Internal neighbours cannot support one another in a circle. Search-cap exceptions are explicit approximations.</text>
