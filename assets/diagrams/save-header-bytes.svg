  <title id="save-header-bytes-title">Fourteen bytes with an explicit layout</title>
  <desc id="save-header-bytes-desc">The worked header begins with ASCII RSTY, then a two-byte little-endian version1, then an eight-byte little-endian seed42. Offsets0..4,4..6 and6..14 are distinct fields.</desc>
