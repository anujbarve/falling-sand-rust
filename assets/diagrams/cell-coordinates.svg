  <text x="695.0" y="194.5" fill="#243b35" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">x = 3 × 4 = 12</text>
  <text x="695.0" y="223.5" fill="#61736c" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">y = 2 × 4 = 8</text>
  <text x="32" y="370" fill="#61736c" font-family="Arial, sans-serif" font-size="17" text-anchor="start">Position changes where the block is drawn; its width and height stay 4 pixels.</text>
