  <title id="pixel-units-title">One cell occupies 2 × 2 art pixels</title>
  <desc id="pixel-units-desc">A simulation cell occupies two by two art pixels. Each art pixel expands to a two by two block of physical pixels, producing a four by four physical-pixel cell.</desc>
