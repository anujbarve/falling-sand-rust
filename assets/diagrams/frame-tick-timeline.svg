<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="frame-tick-timeline-title frame-tick-timeline-desc">
  <title id="frame-tick-timeline-title">Drawing frames are not simulation ticks</title>
  <desc id="frame-tick-timeline-desc">At a steady 60 FPS, frames arrive roughly every 16.67 milliseconds. At 20 TPS, simulation updates are due every 50 milliseconds; scheduling uses elapsed time, not frame count.</desc>
  <rect x="0" y="0" width="960" height="400" fill="#f5f3eb" stroke="none" stroke-width="1" rx="0" />
  <text x="32" y="38" fill="#243b35" font-family="Arial, sans-serif" font-size="25" text-anchor="start">Drawing frames are not simulation ticks</text>
  <text x="30" y="140" fill="#243b35" font-family="Arial, sans-serif" font-size="20" text-anchor="start">Frames</text>
  <text x="30" y="242" fill="#243b35" font-family="Arial, sans-serif" font-size="20" text-anchor="start">Ticks</text>
  <line x1="130" y1="132" x2="850" y2="132" stroke="#aabbb0" stroke-width="2" />
  <line x1="130" y1="234" x2="850" y2="234" stroke="#aabbb0" stroke-width="2" />
  <rect x="127" y="120" width="6" height="24" fill="#aabbb0" stroke="none" stroke-width="1" rx="0" />
  <rect x="125" y="218" width="10" height="32" fill="#28755b" stroke="none" stroke-width="1" rx="0" />
  <rect x="199" y="120" width="6" height="24" fill="#aabbb0" stroke="none" stroke-width="1" rx="0" />
  <rect x="271" y="120" width="6" height="24" fill="#aabbb0" stroke="none" stroke-width="1" rx="0" />
  <rect x="343" y="120" width="6" height="24" fill="#aabbb0" stroke="none" stroke-width="1" rx="0" />
  <rect x="341" y="218" width="10" height="32" fill="#28755b" stroke="none" stroke-width="1" rx="0" />
  <rect x="415" y="120" width="6" height="24" fill="#aabbb0" stroke="none" stroke-width="1" rx="0" />
  <rect x="487" y="120" width="6" height="24" fill="#aabbb0" stroke="none" stroke-width="1" rx="0" />
  <rect x="559" y="120" width="6" height="24" fill="#aabbb0" stroke="none" stroke-width="1" rx="0" />
  <rect x="557" y="218" width="10" height="32" fill="#28755b" stroke="none" stroke-width="1" rx="0" />
  <rect x="631" y="120" width="6" height="24" fill="#aabbb0" stroke="none" stroke-width="1" rx="0" />
  <rect x="703" y="120" width="6" height="24" fill="#aabbb0" stroke="none" stroke-width="1" rx="0" />
  <rect x="775" y="120" width="6" height="24" fill="#aabbb0" stroke="none" stroke-width="1" rx="0" />
  <rect x="773" y="218" width="10" height="32" fill="#28755b" stroke="none" stroke-width="1" rx="0" />
  <rect x="847" y="120" width="6" height="24" fill="#aabbb0" stroke="none" stroke-width="1" rx="0" />
  <text x="130" y="294" fill="#61736c" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">0 ms</text>
  <text x="346" y="294" fill="#61736c" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">50 ms</text>
  <text x="562" y="294" fill="#61736c" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">100 ms</text>
  <text x="778" y="294" fill="#61736c" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">150 ms</text>
  <text x="32" y="370" fill="#61736c" font-family="Arial, sans-serif" font-size="17" text-anchor="start">This regular timeline is an example. Real frames vary; the accumulator retains fractional elapsed time.</text>
</svg>