<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="worker-epoch-title worker-epoch-desc">
  <title id="worker-epoch-title">A result must still belong to the current world</title>
  <desc id="worker-epoch-desc">A worker owns its requested cell buffer. Its reply carries a world epoch and chunk identity. The main thread compares the epoch before installing the result; stale replies are discarded.</desc>
  <rect x="0" y="0" width="960" height="400" fill="#f5f3eb" stroke="none" stroke-width="1" rx="0" />
  <text x="32" y="38" fill="#243b35" font-family="Arial, sans-serif" font-size="25" text-anchor="start">A result must still belong to the current world</text>
  <rect x="35" y="105" width="220" height="90" fill="#e1eae1" stroke="#aabbb0" stroke-width="1" rx="5" />
  <text x="145.0" y="147.0" fill="#243b35" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">main requests</text>
  <text x="145.0" y="176.0" fill="#61736c" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">epoch 7, chunk −1</text>
  <line x1="255" y1="150" x2="320" y2="150" stroke="#28755b" stroke-width="3" />
  <polygon points="320,150 310.0950818741206,154.78462087522354 310.0950818741206,145.21537912477646" fill="#28755b" />
  <rect x="320" y="105" width="250" height="90" fill="#e1eae1" stroke="#aabbb0" stroke-width="1" rx="5" />
  <text x="445.0" y="147.0" fill="#243b35" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">worker builds</text>
  <text x="445.0" y="176.0" fill="#61736c" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">owned cell buffer</text>
  <line x1="570" y1="150" x2="640" y2="150" stroke="#28755b" stroke-width="3" />
  <polygon points="640,150 630.0950818741205,154.78462087522354 630.0950818741205,145.21537912477646" fill="#28755b" />
  <rect x="640" y="105" width="280" height="90" fill="#e1eae1" stroke="#aabbb0" stroke-width="1" rx="5" />
  <text x="780.0" y="147.0" fill="#243b35" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">labelled reply</text>
  <text x="780.0" y="176.0" fill="#61736c" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">epoch 7, chunk −1</text>
  <line x1="780" y1="195" x2="780" y2="240" stroke="#28755b" stroke-width="3" />
  <polygon points="780,240 775.2153791247765,230.09508187412055 784.7846208752235,230.09508187412055" fill="#28755b" />
  <rect x="640" y="240" width="280" height="90" fill="#e1eae1" stroke="#aabbb0" stroke-width="1" rx="5" />
  <text x="780.0" y="282.0" fill="#243b35" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">main checks epoch</text>
  <text x="780.0" y="311.0" fill="#61736c" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">current world: epoch 7</text>
  <line x1="640" y1="285" x2="580" y2="285" stroke="#28755b" stroke-width="3" />
  <polygon points="580,285 589.9049181258795,280.21537912477646 589.9049181258795,289.78462087522354" fill="#28755b" />
  <text x="310" y="268" fill="#28755b" font-family="Arial, sans-serif" font-size="22" text-anchor="start">same epoch → install chunk</text>
  <text x="310" y="310" fill="#61736c" font-family="Arial, sans-serif" font-size="20" text-anchor="start">old epoch → discard stale result</text>
  <text x="32" y="370" fill="#61736c" font-family="Arial, sans-serif" font-size="17" text-anchor="start">A channel transfers ownership; identity checks prevent a valid old result corrupting a new world.</text>
</svg>